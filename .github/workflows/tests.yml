appId: com.taskmanager.app
---
# Flujo propio: ciclo de eliminación con diálogo de confirmación.
# Cubre un recorrido distinto al flujo base: ejercita ConfirmDeleteDialog,
# incluyendo la cancelación (la tarea debe permanecer) y la confirmación.
# Se usa extendedWaitUntil porque el Modal tiene animación de entrada/salida.

# 1. Abrir la app con estado limpio
- launchApp:
    clearState: true
- assertVisible: "Nueva tarea"

# 2. Crear la tarea que luego se eliminará
- tapOn:
    id: "input-titulo"
- inputText: "Tarea temporal para eliminar"
- tapOn: "Guardar"
- assertVisible: "Tarea temporal para eliminar"

# 3. Abrir el diálogo de confirmación desde la tarjeta
- tapOn: "Eliminar tarea Tarea temporal para eliminar"
- extendedWaitUntil:
    visible: "Confirmar eliminación"
    timeout: 5000

# 4. CANCELAR: la tarea NO debe eliminarse
- tapOn: "Cancelar"
- extendedWaitUntil:
    notVisible: "Confirmar eliminación"
    timeout: 5000
- assertVisible: "Tarea temporal para eliminar"

# 5. Reabrir el diálogo y CONFIRMAR la eliminación
- tapOn: "Eliminar tarea Tarea temporal para eliminar"
- extendedWaitUntil:
    visible: "Confirmar eliminación"
    timeout: 5000
- tapOn: "Confirmar eliminación"

# 6. Verificar que la tarea desapareció de la lista
- extendedWaitUntil:
    notVisible: "Tarea temporal para eliminar"
    timeout: 5000
    